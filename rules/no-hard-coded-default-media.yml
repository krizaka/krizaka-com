id: no-hard-coded-default-media
language: Tsx
severity: error
message: "Default media URLs (avatars, banners, logos) come from the Krizaka org JSON (`@krizaka/org`: `listDefaults(kind)`, `defaultFor(kind, seed)`) — never hard-coded or bundled in an app. A `people/defaults` or `defaults/v<n>/` path, or the founder's `krizaka-defaults` folder, is not written here."
rule:
  kind: string_fragment
  regex: "(people/defaults|krizaka-defaults|krizaka-assets[^/]*/defaults/)"
ignores:
  - "**/node_modules/**"
  - "**/.next/**"
  - "**/dist/**"
  - "scripts/**"
  - "tests/**"
  - "rule-tests/**"
