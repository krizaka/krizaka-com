# Production deploys on release, not on every merge (krizaka/krizaka-com#389). When a release is published (release-please's
# « chore: release » merged), the `production` branch is fast-forwarded to its tag — never forced, never moved backwards —
# and the DigitalOcean App Platform app, which deploys from `production`, ships it. The logic and its guards live in
# scripts/promote-production.mjs (tested by tests/promote-production.test.mjs against a real git repository).
name: production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to promote (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - id: app
        if: ${{ vars.RELEASE_APP_ID != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }} # zizmor: ignore[artipacked] promote-production.mjs pushes the production branch with this token

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          package-manager-cache: false # a release job: no shared cache that a pull request could poison

      - name: Fast-forward production to the release tag
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: node scripts/promote-production.mjs "$TAG"
