name: IndexNow

# Once a day (and on demand), tell Bing/Yandex which pages exist. It used to run on every push to main and `sleep 600`
# on a billed runner while DigitalOcean redeployed: ~10 minutes per merge for a ping the search engines read at their
# own pace (CI-COST). The sitemap is the whole list, so one daily submission covers every merge of the day.
on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  ping:
    name: Ping IndexNow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Submit the sitemap URLs
        run: node scripts/indexnow.mjs
