name: IndexNow

# After a merge on main, DigitalOcean rebuilds and redeploys the site; once it is live, tell Bing/Yandex which pages exist.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: true

jobs:
  ping:
    name: Ping IndexNow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Wait for the deployment to serve the new build
        run: sleep 600
      - name: Submit the sitemap URLs
        run: node scripts/indexnow.mjs
