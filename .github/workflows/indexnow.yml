name: IndexNow

# After a merge on main, DigitalOcean rebuilds and redeploys the site; once it is live, tell Bing/Yandex which pages exist.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  ping:
    name: Ping IndexNow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Wait for the deployment to serve the new build
        run: sleep 600
      - name: Submit the sitemap URLs
        run: node scripts/indexnow.mjs
