# The changelog is data read at build (scripts/gen-changelog.mjs): a release of a product must reach krizaka.com without
# a commit (krizaka/.github#184). Each product's release workflow sends `product-release` (repository_dispatch); a daily
# schedule covers a missed one. Both rebuild the site on DigitalOcean (a forced deployment of the same commit).
# Needs the repository secret DIGITALOCEAN_ACCESS_TOKEN (an app-scoped token, as deploy-watch); without it the run says so.
name: Changelog refresh

on:
  repository_dispatch:
    types: [product-release]
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: changelog-refresh
  cancel-in-progress: false

jobs:
  rebuild:
    name: Rebuild krizaka.com
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
    steps:
      - name: Is the DigitalOcean token set?
        id: gate
        run: |
          if [ -z "$DIGITALOCEAN_ACCESS_TOKEN" ]; then
            echo "::warning title=changelog-refresh is off::the secret DIGITALOCEAN_ACCESS_TOKEN is not set (krizaka/.github#184); the changelog only changes with the next deployment"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.enabled == 'true'
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - if: steps.gate.outputs.enabled == 'true'
        name: Force a rebuild
        env:
          FROM: ${{ github.event.client_payload.repo || github.event_name }} ${{ github.event.client_payload.tag }}
        run: |
          id=$(doctl apps list --format ID,Spec.Name --no-header | awk '$2 == "krizaka-com" { print $1 }')
          test -n "$id" || { echo "::error::no app named krizaka-com"; exit 1; }
          doctl apps create-deployment "$id" --force-rebuild --wait
          echo "Rebuilt for $FROM"
