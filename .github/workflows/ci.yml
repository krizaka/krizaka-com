name: Continuous Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  merge_group:

# Read-only token: the build only reads public data (the org's repository count).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The pipeline is the org's (krizaka/.github docs/standards/ci-and-deploy.md): the changes gate, the caches, the timeouts and the
  # gate that always reports live there. This file says only what is krizaka.com's.
  ci:
    uses: krizaka/.github/.github/workflows/node-ci.yml@cf1e598a446ed2d4d98b98a67ec9795c0f80100d # main (merge queue, layout guard)
    permissions:
      contents: read
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    with:
      # SonarCloud CI analysis after the tests, with the coverage `test:coverage` writes (krizaka/.github#237).
      sonar: true
      sonar-coverage-paths: coverage/lcov.info
      test-script: test:coverage
      # The shared install runs no dependency script (npm ci --ignore-scripts, krizaka/.github setup): the generators of lib/*.json
      # (postinstall: scripts/gen-fresh.mjs) run here, explicitly, before the lint reads them (depcruise: not-to-unresolvable).
      install-command: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund && node scripts/gen-fresh.mjs
      duplication: true      # jscpd + dup-ratchet.json: duplicated lines may only go down
      next-cache-paths: .next/cache
      # scripts/gen-org-stats.mjs reads the organisation's public repository count without the anonymous rate limit
      github-token-env: APP_GITHUB_TOKEN
      container: true
      container-image: krizaka-com:ci
      container-smoke: scripts/ci-container-smoke.sh
      container-playwright-cache: true
      # A change that touches no code (issue and PR templates, the dependabot and Scorecard files, licence and policy text)
      # skips the heavy jobs. Fails open.
      ignore: '^\.github/(?!workflows/ci\.yml$)|^(LICENSE|SECURITY|CODE_OF_CONDUCT|SUPPORT)(\.md)?$'
