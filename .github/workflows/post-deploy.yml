# The release train promotes `production` (production.yml) and DigitalOcean rebuilds and deploys it (krizaka/.github#438, #442):
# wait until www.krizaka.com serves this commit (/build.json, scripts/build-info.mjs), then IndexNow (changed URLs only) and the
# family's SEO guard on the live host. Red opens one issue here. It replaces the daily indexnow.yml.
name: post-deploy

on:
  push:
    branches: [production]
  workflow_dispatch: # run it from the `production` branch: it waits for that branch's commit

permissions:
  contents: read

concurrency:
  group: post-deploy
  cancel-in-progress: false

jobs:
  post-deploy:
    permissions:
      contents: read
      issues: write
    uses: krizaka/.github/.github/workflows/post-deploy.yml@1002810b78ccc24e284ec8209e8e0b55ff06ea33
    with:
      site-url: https://www.krizaka.com
      version-url: https://www.krizaka.com/build.json
      expect: ${{ github.sha }}
      indexnow-key: 618a944a62de7ebaf79cc9b96ed57c0c # gitleaks:allow — the IndexNow key is public by design (served at /<key>.txt)
      seo-args: "--organization"
