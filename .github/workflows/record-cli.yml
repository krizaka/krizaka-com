# Records the Orazaka CLI's quick start (install → start → dev) on a fresh Ubuntu machine, for the terminal replay of
# /docs/orazaka/cli: scripts/record-cli.mjs runs the published `orazaka` package and writes session.json, uploaded as an
# artifact — download it into public/assets/orazaka/cli/ and commit it. A fresh runner, never a workstation whose
# Orazaka infrastructure is in use (the `orazaka` compose project would be recreated).
name: Record the CLI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "orazaka version to record (empty: the latest)"
        required: false
  pull_request:
    paths: [scripts/record-cli.mjs, .github/workflows/record-cli.yml]

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Record
        run: node scripts/record-cli.mjs --scratch "$RUNNER_TEMP/projects" ${{ inputs.version && format('--version {0}', inputs.version) || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: cli-session
          path: public/assets/orazaka/cli/session.json
