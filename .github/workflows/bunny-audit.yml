name: Bunny audit

# Once a day (and on demand, and when the layout changes), audit the storage zone against the layout of
# scripts/bunny-layout.mjs (ADR-014): fails on any object outside it. Legacy objects (old roots still served while they
# migrate) are reported, not failed, until the migration ends (then: --strict). Read-only: it only lists the zone.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/bunny-layout.mjs
      - scripts/cdn-assets.mjs
      - .github/workflows/bunny-audit.yml

permissions:
  contents: read

concurrency:
  group: bunny-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tree:
    name: Audit the storage zone
    # A fork's pull request has no secrets: the daily run covers it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: cdn-assets tree
        env:
          MEDIA_STORAGE_API_KEY: ${{ secrets.MEDIA_STORAGE_API_KEY }}
          MEDIA_STORAGE_ZONE: ${{ secrets.MEDIA_STORAGE_ZONE }}
          MEDIA_STORAGE_ENDPOINT: ${{ secrets.MEDIA_STORAGE_ENDPOINT }}
          MEDIA_CDN_HOSTNAME: ${{ secrets.MEDIA_CDN_HOSTNAME }}
        run: node scripts/cdn-assets.mjs tree
